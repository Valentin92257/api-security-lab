name: Generated API code

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: generated-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Regenerate API code
        run: mvn --batch-mode --no-transfer-progress clean generate-sources
      - name: Check generated API code
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          set -- ':(glob)apps/*/target/generated-sources/*/src/main/java/**/*.java' \
                 ':(glob)libs/*/target/generated-sources/*/src/main/java/**/*.java'
          if ! git diff --exit-code -- "$@" ||
             [ -n "$(git ls-files --others --exclude-standard -- "$@")" ]; then
            git status --short --untracked-files=all -- "$@"
            echo "::error::Сгенерированный код устарел. Повторите генерацию по инструкции в README и добавьте обновлённые Java-файлы в коммит."
            exit 1
          fi
