name: Generated API code

on: [push, pull_request]

permissions:
  contents: read

jobs:
  generated-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Regenerate API code
        run: ./mvnw --batch-mode clean generate-sources
      - name: Check generated API code
        shell: bash
        run: |
          generated=':(glob)apps/*/target/generated-sources/*/src/main/java/**/*.java'
          if ! git diff --exit-code -- "$generated" ||
             [ -n "$(git ls-files --others --exclude-standard -- "$generated")" ]; then
            git status --short --untracked-files=all -- "$generated"
            echo "::error::Сгенерированный код устарел. Выполните ./mvnw clean generate-sources и добавьте обновлённые Java-файлы в коммит."
            exit 1
          fi
