name: Publish images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish-ghcr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image metadata
        id: meta
        run: |
          repo_lc=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          short_sha="${GITHUB_SHA:0:7}"
          sha_tag="sha-${short_sha}"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="latest,${sha_tag}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            minor=$(printf '%s' "$ver" | cut -d. -f1-2)
            if [ "$minor" != "$ver" ] && [[ "$ver" == *.*.* ]]; then
              tags="${ver},${minor},${sha_tag}"
            else
              tags="${ver},${sha_tag}"
            fi
          else
            tags="${sha_tag}"
          fi

          {
            echo "registry=ghcr.io/${repo_lc}"
            echo "sha_tag=${sha_tag}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"
          echo "Registry: ghcr.io/${repo_lc}"
          echo "Tags:     ${tags}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch images
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          push: true
          set: |
            *.platform=linux/amd64
            *.platform=linux/arm64
            *.annotations=index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            *.annotations=index:org.opencontainers.image.revision=${{ github.sha }}
            *.cache-from=type=gha,scope=bake
            *.cache-to=type=gha,mode=max,scope=bake
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SKIP_TESTS: "true"
          REVISION: ${{ github.sha }}

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${{ steps.meta.outputs.registry }}/shop-api:${{ steps.meta.outputs.sha_tag }}"

  install-smoke:
    name: install-smoke
    runs-on: ubuntu-latest
    needs: publish
    permissions: { }
    steps:
      - name: Install stack anonymously via install.sh
        env:
          LAB_REPO: ${{ github.repository }}
          LAB_REF: ${{ github.sha }}
          LAB_VERSION: ${{ needs.publish.outputs.sha_tag }}
          LAB_IMAGE_PREFIX: ${{ needs.publish.outputs.registry }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${LAB_REPO}/${LAB_REF}/scripts/install.sh" | sh

      - name: Hint if GHCR packages are still private
        if: failure()
        run: |
          echo "::warning::Если это первая публикация, новые пакеты в GHCR по умолчанию Private. Откройте 5 пакетов (shop-api, lab-gateway, lab-detector, lab-control, lab-db) в GitHub Packages -> Package settings -> Change visibility -> Public, затем нажмите Re-run failed jobs."

      - name: Health check all services
        working-directory: api-security-lab
        run: |
          check() {
            echo "== $1:$2"
            docker compose exec -T "$1" wget -q -O - -T 5 "http://127.0.0.1:$2/health"
            echo
          }
          check lab-control 8080
          check lab-gateway 8081
          check lab-gateway 8082
          check shop-vulnerable 8080
          check shop-protected 8080
          check lab-detector 8080

      - name: Show logs on failure
        if: failure() && hashFiles('api-security-lab/compose.yaml') != ''
        working-directory: api-security-lab
        run: docker compose logs --tail=200

      - name: Stop stack
        if: always() && hashFiles('api-security-lab/compose.yaml') != ''
        working-directory: api-security-lab
        run: docker compose down -v
