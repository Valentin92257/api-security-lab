$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  FixtureUser:
    title: FixtureUser
    type: object
    properties:
      userId: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      login: {type: string, minLength: 3, maxLength: 32}
      credentialRef: {type: string, minLength: 1, maxLength: 100}
    required: [userId, login, credentialRef]
    additionalProperties: false
  FixtureProduct:
    title: FixtureProduct
    type: object
    properties:
      productId: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      name: {type: string, minLength: 1, maxLength: 120}
      description: {type: string, minLength: 0, maxLength: 4000}
      price: {type: integer, minimum: 1, maximum: 1000000000}
      published: {type: boolean}
    required: [productId, name, description, price, published]
    additionalProperties: false
  FixtureCoupon:
    title: FixtureCoupon
    type: object
    properties:
      couponId: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      code: {type: string, minLength: 1, maxLength: 32}
      kind:
        type: string
        enum: [VALID, EXPIRED, EXHAUSTED, LAST_USE, FULL_DISCOUNT]
      discountPercent: {type: integer, minimum: 1, maximum: 100}
      expiresAt: {type: string, format: date-time, pattern: Z$}
      maxUses: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      usedCount: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
    required: [couponId, code, kind, discountPercent, expiresAt, maxUses, usedCount]
    additionalProperties: false
  FixtureOrder:
    title: FixtureOrder
    type: object
    properties:
      orderId: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      ownerId: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      cartId: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      cartRevision: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
      couponId:
        type: [integer, 'null']
        format: int64
        minimum: 1
        maximum: 9007199254740991
    required: [orderId, ownerId, cartId, cartRevision, couponId]
    additionalProperties: false
  FixtureSnapshot:
    title: FixtureSnapshot
    type: object
    properties:
      version: {type: string, minLength: 1, maxLength: 100}
      hash: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$'}
      seed: {type: integer, minimum: 0, maximum: 2147483647}
      businessTimeBase: {type: string, format: date-time, pattern: Z$}
      users:
        type: array
        items: {$ref: '#/$defs/FixtureUser'}
        minItems: 24
        maxItems: 1000
      products:
        type: array
        items: {$ref: '#/$defs/FixtureProduct'}
        minItems: 13
        maxItems: 1000
      coupons:
        type: array
        items: {$ref: '#/$defs/FixtureCoupon'}
        minItems: 5
        maxItems: 1000
      orders:
        type: array
        items: {$ref: '#/$defs/FixtureOrder'}
        minItems: 2
        maxItems: 1000
    required: [version, hash, seed, businessTimeBase, users, products, coupons, orders]
    additionalProperties: false
  Step:
    title: Step
    type: object
    properties:
      stepId: {type: string, format: uuid}
      ordinal: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
      concurrentGroup:
        type: [string, 'null']
        minLength: 1
        maxLength: 100
      description: {type: string, minLength: 1, maxLength: 300}
      actorId:
        type: [integer, 'null']
        format: int64
        minimum: 1
        maximum: 9007199254740991
    required: [stepId, ordinal, concurrentGroup, description, actorId]
    additionalProperties: false
  CasePlan:
    title: CasePlan
    type: object
    properties:
      caseId: {type: string, minLength: 1, maxLength: 128}
      family: {$ref: './common.yaml#/$defs/Family'}
      label:
        type: string
        enum: [ATTACK, BENIGN]
      oracle:
        type: string
        enum: [LOGIN_SESSION, FOREIGN_PROFILE, FOREIGN_ORDER, CATALOG_CANARY, CHECKOUT_ONCE, IDEMPOTENCY_CONFLICT,
          COUPON_EXPIRY, COUPON_LIMIT, COUPON_STACKING, QUANTITY, CART_RACE, SHARED_COUPON_RACE, SERVER_PRICE]
      stepIds:
        type: array
        items: {type: string, format: uuid}
        minItems: 1
        maxItems: 10000
        uniqueItems: true
      actorIds:
        type: array
        items: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        minItems: 1
        maxItems: 24
        uniqueItems: true
      resources:
        type: object
        additionalProperties: false
        properties:
          userIds:
            type: array
            items: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
            minItems: 0
            maxItems: 100
            uniqueItems: true
          orderIds:
            type: array
            items: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
            minItems: 0
            maxItems: 100
            uniqueItems: true
          productIds:
            type: array
            items: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
            minItems: 0
            maxItems: 100
            uniqueItems: true
          couponIds:
            type: array
            items: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
            minItems: 0
            maxItems: 100
            uniqueItems: true
          cartIds:
            type: array
            items: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
            minItems: 0
            maxItems: 100
            uniqueItems: true
        required: [userIds, orderIds, productIds, couponIds, cartIds]
    required: [caseId, family, label, oracle, stepIds, actorIds, resources]
    additionalProperties: false
  EpisodePlan:
    title: EpisodePlan
    type: object
    properties:
      episodeId: {type: string, minLength: 1, maxLength: 128}
      family: {$ref: './common.yaml#/$defs/Family'}
      label:
        type: string
        enum: [ATTACK, BENIGN]
      stepIds:
        type: array
        items: {type: string, format: uuid}
        minItems: 1
        maxItems: 10000
        uniqueItems: true
      attackSpecificStepIds:
        type: array
        items: {type: string, format: uuid}
        minItems: 0
        maxItems: 10000
        uniqueItems: true
    required: [episodeId, family, label, stepIds, attackSpecificStepIds]
    additionalProperties: false
  RunPlan:
    title: RunPlan
    type: object
    properties:
      planId: {type: string, format: uuid}
      runId: {type: string, format: uuid}
      mode: {$ref: './common.yaml#/$defs/Mode'}
      families:
        type: array
        items: {$ref: './common.yaml#/$defs/Family'}
        minItems: 1
        maxItems: 5
        uniqueItems: true
      seed: {type: integer, minimum: 0, maximum: 2147483647}
      fixtureHash: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$'}
      deadlineAt: {type: string, format: date-time, pattern: Z$}
      allowedSourceKeys:
        type: array
        items: {type: string, minLength: 1, maxLength: 128}
        minItems: 1
        maxItems: 1000
        uniqueItems: true
      steps:
        type: array
        items: {$ref: '#/$defs/Step'}
        minItems: 1
        maxItems: 10000
      cases:
        type: array
        items: {$ref: '#/$defs/CasePlan'}
        minItems: 1
        maxItems: 1000
      episodes:
        type: array
        items: {$ref: '#/$defs/EpisodePlan'}
        minItems: 1
        maxItems: 1000
    required: [planId, runId, mode, families, seed, fixtureHash, deadlineAt, allowedSourceKeys, steps, cases,
      episodes]
    additionalProperties: false
  ResponseFacts:
    title: ResponseFacts
    type: object
    properties:
      tokenReceived: {type: boolean}
      userId: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      orderId: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      orderOwnerId: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      productIds:
        type: array
        items: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        minItems: 0
        maxItems: 100
      cartRevision: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
      quantities:
        type: array
        items: {type: integer}
        minItems: 0
        maxItems: 100
      orderTotal: {type: integer}
      couponCode: {type: string, minLength: 1, maxLength: 32}
      problemCode: {type: string, minLength: 1, maxLength: 100}
      responseSchemaValid: {type: boolean}
    required: []
    additionalProperties: false
    description: Без JWT/паролей/raw body; неизвестные поля опускаются.
  AttemptResult:
    title: AttemptResult
    type: object
    properties:
      runId: {type: string, format: uuid}
      stepId: {type: string, format: uuid}
      requestId: {type: string, format: uuid}
      retryNumber: {type: integer, minimum: 0, maximum: 10}
      method: {type: string, minLength: 1, maxLength: 32}
      route: {type: string, minLength: 1, maxLength: 200}
      startedAt: {type: string, format: date-time, pattern: Z$}
      finishedAt: {type: string, format: date-time, pattern: Z$}
      durationMs: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
      transportOutcome:
        type: string
        enum: [RESPONSE, TIMEOUT, CONNECT_ERROR, CANCELLED]
      httpStatus:
        type: [integer, 'null']
        minimum: 100
        maximum: 599
      responseFacts: {$ref: '#/$defs/ResponseFacts'}
    required: [runId, stepId, requestId, retryNumber, method, route, startedAt, finishedAt, durationMs, transportOutcome,
      httpStatus, responseFacts]
    additionalProperties: false
  ExecutionSummary:
    title: ExecutionSummary
    type: object
    properties:
      runId: {type: string, format: uuid}
      requestIds:
        type: array
        items: {type: string, format: uuid}
        minItems: 0
        maxItems: 10000
        uniqueItems: true
      skippedStepIds:
        type: array
        items: {type: string, format: uuid}
        minItems: 0
        maxItems: 10000
        uniqueItems: true
      cancelled: {type: boolean}
      errors:
        type: array
        items: {$ref: './common.yaml#/$defs/Failure'}
        minItems: 0
        maxItems: 100
    required: [runId, requestIds, skippedStepIds, cancelled, errors]
    additionalProperties: false
