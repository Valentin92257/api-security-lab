$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  CreateTrialRequest:
    title: CreateTrialRequest
    type: object
    properties:
      families:
        type: array
        items: {$ref: './common.yaml#/$defs/Family'}
        minItems: 1
        maxItems: 5
        uniqueItems: true
      seed: {type: integer, minimum: 0, maximum: 2147483647}
    required: [families]
    additionalProperties: false
  ScenarioInfo:
    title: ScenarioInfo
    type: object
    properties:
      family: {$ref: './common.yaml#/$defs/Family'}
      name: {type: string, minLength: 1, maxLength: 100}
      description: {type: string, minLength: 1, maxLength: 500}
    required: [family, name, description]
    additionalProperties: false
  RunSummary:
    title: RunSummary
    type: object
    properties:
      runId: {type: string, format: uuid}
      mode: {$ref: './common.yaml#/$defs/Mode'}
      state:
        type: string
        enum: [PREPARING, RUNNING, FINALIZING, COMPLETED, FAILED, CANCELLED, INCONCLUSIVE]
      analysisState:
        type: [string, 'null']
        enum: [ACCEPTING, FINISHING, COMPLETED, FAILED, null]
      error:
        anyOf:
        - {$ref: './common.yaml#/$defs/Failure'}
        - {type: 'null'}
    required: [runId, mode, state, analysisState, error]
    additionalProperties: false
  Trial:
    title: Trial
    type: object
    properties:
      trialId: {type: string, format: uuid}
      families:
        type: array
        items: {$ref: './common.yaml#/$defs/Family'}
        minItems: 1
        maxItems: 5
        uniqueItems: true
      seed: {type: integer, minimum: 0, maximum: 2147483647}
      state:
        type: string
        enum: [PREPARING, RUNNING, FINALIZING, COMPLETED, FAILED, CANCELLED, INCONCLUSIVE]
      createdAt: {type: string, format: date-time, pattern: Z$}
      finishedAt:
        type: [string, 'null']
        format: date-time
        pattern: Z$
      plannedSteps: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
      finishedSteps: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
      cleanupSafe: {type: boolean}
      runs:
        type: array
        items: {$ref: '#/$defs/RunSummary'}
        minItems: 0
        maxItems: 2
      error:
        anyOf:
        - {$ref: './common.yaml#/$defs/Failure'}
        - {type: 'null'}
    required: [trialId, families, seed, state, createdAt, finishedAt, plannedSteps, finishedSteps, cleanupSafe,
      runs, error]
    additionalProperties: false
  TrialPage:
    title: TrialPage
    type: object
    properties:
      items:
        type: array
        items: {$ref: '#/$defs/Trial'}
        minItems: 0
        maxItems: 100
      limit: {type: integer, minimum: 1, maximum: 100}
      offset: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
      total: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
    required: [items, limit, offset, total]
    additionalProperties: false
  CaseResult:
    title: CaseResult
    type: object
    properties:
      caseId: {type: string, minLength: 1, maxLength: 128}
      family: {$ref: './common.yaml#/$defs/Family'}
      label:
        type: string
        enum: [ATTACK, BENIGN]
      effect:
        type: string
        enum: [EFFECT_OBSERVED, EFFECT_NOT_OBSERVED, INCONCLUSIVE]
      requestIds:
        type: array
        items: {type: string, format: uuid}
        minItems: 0
        maxItems: 10000
        uniqueItems: true
      reason: {type: string}
    required: [caseId, family, label, effect, requestIds, reason]
    additionalProperties: false
  EpisodeResult:
    title: EpisodeResult
    type: object
    properties:
      episodeId: {type: string, minLength: 1, maxLength: 128}
      family: {$ref: './common.yaml#/$defs/Family'}
      label:
        type: string
        enum: [ATTACK, BENIGN]
      result:
        type: string
        enum: [DETECTED, MISSED, CLEAN, FALSE_POSITIVE, INCONCLUSIVE]
      matchedIncidentIds:
        type: array
        items: {type: string, format: uuid}
        minItems: 0
        maxItems: 1000
        uniqueItems: true
      requestIds:
        type: array
        items: {type: string, format: uuid}
        maxItems: 10000
        uniqueItems: true
    required: [episodeId, family, label, result, matchedIncidentIds, requestIds]
    additionalProperties: false
  IncidentAssessment:
    title: IncidentAssessment
    type: object
    properties:
      incident: {$ref: './detector.yaml#/$defs/Incident'}
      verdict:
        type: string
        enum: [TRUE_POSITIVE, FALSE_POSITIVE, UNASSESSED]
      matchedEpisodeIds:
        type: array
        items: {type: string, minLength: 1, maxLength: 128}
        minItems: 0
        maxItems: 1000
        uniqueItems: true
      reason: {type: string, minLength: 1, maxLength: 1000}
    required: [incident, verdict, matchedEpisodeIds, reason]
    additionalProperties: false
  RunReport:
    title: RunReport
    type: object
    properties:
      runId: {type: string, format: uuid}
      mode: {$ref: './common.yaml#/$defs/Mode'}
      state:
        type: string
        enum: [COMPLETED, FAILED, CANCELLED, INCONCLUSIVE]
      analysisState:
        type: [string, 'null']
        enum: [ACCEPTING, FINISHING, COMPLETED, FAILED, null]
      cases:
        type: array
        items: {$ref: '#/$defs/CaseResult'}
        minItems: 0
        maxItems: 1000
      episodes:
        type: [array, 'null']
        items: {$ref: '#/$defs/EpisodeResult'}
        minItems: 0
        maxItems: 1000
      incidents:
        type: [array, 'null']
        items: {$ref: '#/$defs/IncidentAssessment'}
        minItems: 0
        maxItems: 10000
      error:
        anyOf:
        - {$ref: './common.yaml#/$defs/Failure'}
        - {type: 'null'}
    required: [runId, mode, state, analysisState, cases, episodes, incidents, error]
    additionalProperties: false
  TrialReport:
    title: TrialReport
    type: object
    properties:
      trialId: {type: string, format: uuid}
      seed: {type: integer, minimum: 0, maximum: 2147483647}
      state:
        type: string
        enum: [COMPLETED, FAILED, CANCELLED, INCONCLUSIVE]
      generatedAt: {type: string, format: date-time, pattern: Z$}
      runs:
        type: array
        items: {$ref: '#/$defs/RunReport'}
        minItems: 0
        maxItems: 2
      families:
        type: array
        items: {$ref: './common.yaml#/$defs/Family'}
        minItems: 1
        maxItems: 5
        uniqueItems: true
    required: [trialId, seed, state, generatedAt, runs, families]
    additionalProperties: false
