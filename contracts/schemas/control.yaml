$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  CreateTrialRequest:
    title: CreateTrialRequest
    type: object
    properties:
      families:
        type: array
        items: {$ref: ./common.yaml#/$defs/Family}
        minItems: 1
        maxItems: 5
        uniqueItems: true
      seed: {type: integer, minimum: 0, maximum: 2147483647}
    required: [families]
    additionalProperties: false
  Trial:
    title: Trial
    type: object
    properties:
      trialId: {type: string, format: uuid}
      families:
        type: array
        items: {$ref: ./common.yaml#/$defs/Family}
        minItems: 1
        maxItems: 5
        uniqueItems: true
      seed: {type: integer, minimum: 0, maximum: 2147483647}
      state: {type: string, enum: [PREPARING, RUNNING, FINALIZING, COMPLETED, FAILED, CANCELLED, INCONCLUSIVE]}
      createdAt: {type: string, format: date-time}
      plannedSteps: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
      finishedSteps: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
      cleanupSafe: {type: boolean, description: Разрешена подготовка данных следующего испытания.}
      error: {type: [string, 'null'], maxLength: 500}
    required: [trialId, families, seed, state, createdAt, plannedSteps, finishedSteps, cleanupSafe]
    additionalProperties: false
  TrialPage:
    title: TrialPage
    type: object
    properties:
      items:
        type: array
        items: {$ref: '#/$defs/Trial'}
        minItems: 0
        maxItems: 100
      total: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
    required: [items, total]
    additionalProperties: false
  CaseResult:
    title: CaseResult
    type: object
    properties:
      caseId: {type: string, minLength: 1, maxLength: 128}
      episodeId: {type: string, minLength: 1, maxLength: 128, description: Общая группа проверок одной кампании для recall/FPR.}
      family: {$ref: ./common.yaml#/$defs/Family}
      label: {type: string, enum: [ATTACK, BENIGN]}
      effect: {type: string, enum: [EFFECT_OBSERVED, EFFECT_NOT_OBSERVED, INCONCLUSIVE]}
      requestIds:
        type: array
        items: {type: string, format: uuid}
        minItems: 0
        maxItems: 10000
        uniqueItems: true
      reason: {type: string}
      detection:
        type: string
        enum: [DETECTED, MISSED, CLEAN, FALSE_POSITIVE, INCONCLUSIVE]
        description: Вычисляется для episodeId по итоговым IncidentAssessment и полноте шагов согласно semantics.md; одинаково у всех cases эпизода, независимо от effect.
    required: [caseId, episodeId, family, label, effect, detection, requestIds, reason]
    additionalProperties: false
  IncidentAssessment:
    title: IncidentAssessment
    type: object
    properties:
      incident: {$ref: ./detector.yaml#/$defs/Incident}
      verdict: {type: string, enum: [TRUE_POSITIVE, FALSE_POSITIVE, UNASSESSED]}
      matchedEpisodeIds:
        description: Связанные episodeId из cases по evidence запросов; TRUE_POSITIVE включает ATTACK, FALSE_POSITIVE только BENIGN, UNASSESSED указывает недоказанную связь.
        type: array
        items: {type: string, minLength: 1, maxLength: 128}
        minItems: 0
        maxItems: 1000
        uniqueItems: true
      reason: {type: string, minLength: 1, maxLength: 1000}
    required: [incident, verdict, matchedEpisodeIds, reason]
    additionalProperties: false
  RunReport:
    title: RunReport
    type: object
    properties:
      runId: {type: string, format: uuid}
      mode: {$ref: ./common.yaml#/$defs/Mode}
      state: {type: string, enum: [COMPLETED, FAILED, CANCELLED, INCONCLUSIVE]}
      cases:
        type: array
        items: {$ref: '#/$defs/CaseResult'}
        minItems: 0
        maxItems: 1000
      incidents:
        type: [array, 'null']
        description: null при незавершённом анализе; пустой массив при отсутствии инцидентов.
        items: {$ref: '#/$defs/IncidentAssessment'}
        minItems: 0
        maxItems: 10000
      error: {type: [string, 'null'], maxLength: 500}
    required: [runId, mode, state, cases, incidents]
    additionalProperties: false
  TrialReport:
    title: TrialReport
    type: object
    properties:
      trialId: {type: string, format: uuid}
      seed: {type: integer, minimum: 0, maximum: 2147483647}
      state: {type: string, enum: [COMPLETED, FAILED, CANCELLED, INCONCLUSIVE]}
      runs:
        type: array
        items: {$ref: '#/$defs/RunReport'}
        minItems: 0
        maxItems: 2
      families:
        type: array
        items: {$ref: ./common.yaml#/$defs/Family}
        minItems: 1
        maxItems: 5
        uniqueItems: true
    required: [trialId, seed, state, runs, families]
    additionalProperties: false
