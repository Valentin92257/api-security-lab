$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  AnalysisStatus:
    title: AnalysisStatus
    type: object
    properties:
      runId: {type: string, format: uuid}
      instanceId: {type: string, format: uuid}
      state:
        type: string
        enum: [ACCEPTING, FINISHING, COMPLETED, FAILED]
      error:
        anyOf:
        - {$ref: './common.yaml#/$defs/Failure'}
        - {type: 'null'}
      observedRequestIds:
        type: [array, 'null']
        items: {type: string, format: uuid}
        minItems: 0
        maxItems: 10000
        uniqueItems: true
    required: [runId, instanceId, state, error, observedRequestIds]
    additionalProperties: false
  FinishAnalysisRequest:
    title: FinishAnalysisRequest
    type: object
    properties:
      expectedLastSequence:
        type: object
        properties:
          GATEWAY: {type: integer, minimum: 0, maximum: 100000}
          SHOP: {type: integer, minimum: 0, maximum: 100000}
        required: [GATEWAY, SHOP]
        additionalProperties: false
      deadlineAt: {type: string, format: date-time, pattern: Z$}
    required: [expectedLastSequence, deadlineAt]
    additionalProperties: false
  Incident:
    title: Incident
    type: object
    properties:
      incidentId: {type: string, format: uuid}
      runId: {type: string, format: uuid}
      family: {$ref: './common.yaml#/$defs/Family'}
      detectedAt: {type: string, format: date-time, pattern: Z$}
      requestIds:
        type: array
        items: {type: string, format: uuid}
        minItems: 1
        maxItems: 10000
        uniqueItems: true
      description: {type: string, minLength: 1, maxLength: 1000}
    required: [incidentId, runId, family, detectedAt, requestIds, description]
    additionalProperties: false
  IncidentPage:
    title: IncidentPage
    type: object
    properties:
      items:
        type: array
        items: {$ref: '#/$defs/Incident'}
        minItems: 0
        maxItems: 100
      limit: {type: integer, minimum: 1, maximum: 100}
      offset: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
      total: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
    required: [items, limit, offset, total]
    additionalProperties: false
