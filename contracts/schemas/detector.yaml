$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  AnalysisStatus:
    title: AnalysisStatus
    type: object
    properties:
      instanceId: {type: string, format: uuid}
      state: {type: string, enum: [ACCEPTING, FINISHING, COMPLETED, FAILED]}
      error: {type: [string, 'null'], maxLength: 500}
      observedRequestIds:
        description: Уникальные requestId обоих producers после COMPLETED; до завершения null. Все Shop-запросы проходят через Gateway.
        type: [array, 'null']
        items: {type: string, format: uuid}
        minItems: 0
        maxItems: 100000
        uniqueItems: true
    required: [instanceId, state, observedRequestIds]
    additionalProperties: false
  FinishAnalysisRequest:
    title: FinishAnalysisRequest
    type: object
    properties:
      gatewayLastSequence: {type: integer, minimum: 0, maximum: 100000}
      shopLastSequence: {type: integer, minimum: 0, maximum: 100000}
      deadlineAt: {type: string, format: date-time}
    required: [gatewayLastSequence, shopLastSequence, deadlineAt]
    additionalProperties: false
  Incident:
    title: Incident
    type: object
    properties:
      incidentId: {type: string, format: uuid}
      family:
        anyOf:
        - {$ref: ./common.yaml#/$defs/Family}
        - {type: 'null'}
      detectedAt: {type: string, format: date-time}
      requestIds:
        type: array
        items: {type: string, format: uuid}
        minItems: 1
        maxItems: 10000
        uniqueItems: true
      description: {type: string, minLength: 1, maxLength: 1000}
    required: [incidentId, detectedAt, requestIds, description]
    additionalProperties: false
  IncidentPage:
    title: IncidentPage
    type: object
    properties:
      items:
        type: array
        items: {$ref: '#/$defs/Incident'}
        minItems: 0
        maxItems: 100
      total: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
    required: [items, total]
    additionalProperties: false
