$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  RunSetup:
    title: RunSetup
    type: object
    properties:
      mode: {$ref: './common.yaml#/$defs/Mode'}
      businessTimeBase: {type: string, format: date-time, pattern: Z$}
      deadlineAt: {type: string, format: date-time, pattern: Z$}
      runToken: {type: string, minLength: 32, maxLength: 256}
      correlationKey: {type: string, minLength: 32, maxLength: 256}
      allowedSourceKeys:
        type: array
        items: {type: string, minLength: 1, maxLength: 128}
        minItems: 1
        maxItems: 1000
        uniqueItems: true
    required: [mode, businessTimeBase, deadlineAt, runToken, correlationKey, allowedSourceKeys]
    additionalProperties: false
  RuntimeStatus:
    title: RuntimeStatus
    type: object
    properties:
      runId: {type: string, format: uuid}
      instanceId: {type: string, format: uuid}
      state:
        type: string
        enum: [PREPARED, OPEN, CLOSING, CLOSED, ERROR]
      inFlight: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
      lastSequence: {type: integer, minimum: 0, maximum: 100000}
      error:
        anyOf:
        - {$ref: './common.yaml#/$defs/Failure'}
        - {type: 'null'}
    required: [runId, instanceId, state, inFlight, lastSequence, error]
    additionalProperties: false
