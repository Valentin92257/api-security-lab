openapi: 3.1.0
info: {title: Detector, version: 1.0.0, description: Control управляет анализом; Shop/Gateway отправляют логи токенами своей
    роли.}
servers:
- {url: /internal/v1}
security:
- {ServiceBearer: []}
paths:
  /events:
    get:
      operationId: listEvents
      description: >-
        Сохранённые AccessLog всех runs либо одного runId; чтение разрешено только Control.
        Фильтры объединяются через AND, значения status через OR. status и statusClass несовместимы.
        Порядок убывания: time (с наносекундами), runId, producer, sequence.
        Курсор привязан к фильтрам; их нужно повторять на следующих страницах. limit можно менять.
        Между запросами нет общего снимка: поздние события требуют нового просмотра с первой страницы.
        Неизвестные, пустые и повторные скалярные параметры дают 400.
        Неизвестный явно заданный runId даёт 404; пустая выборка — 200.
      parameters:
      - name: runId
        in: query
        schema: {type: string, format: uuid}
      - name: from
        in: query
        description: Включительная нижняя граница времени события; from должен быть меньше to.
        schema: {type: string, format: date-time}
      - name: to
        in: query
        description: Исключительная верхняя граница времени события.
        schema: {type: string, format: date-time}
      - name: producer
        in: query
        schema: {type: string, enum: [GATEWAY, SHOP]}
      - name: requestId
        in: query
        schema: {type: string, format: uuid}
      - name: method
        in: query
        schema: {type: string, minLength: 1, maxLength: 32, pattern: '^[A-Z][A-Z0-9!#$%&''*+.^_`|~-]*$'}
      - name: status
        in: query
        style: form
        explode: true
        description: Один или несколько кодов, например status=401&status=403.
        schema:
          type: array
          minItems: 1
          maxItems: 500
          items: {type: integer, minimum: 100, maximum: 599}
      - name: statusClass
        in: query
        schema: {type: string, pattern: '^[1-5]xx$'}
      - name: route
        in: query
        schema: {type: string, minLength: 1, maxLength: 200, pattern: '^/.*$'}
      - name: remoteAddr
        in: query
        schema: {type: string, minLength: 2, maxLength: 45}
      - name: userId
        in: query
        schema: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      - {$ref: '#/components/parameters/limit'}
      - name: cursor
        in: query
        description: Непрозрачный nextCursor предыдущей страницы с теми же фильтрами.
        schema: {type: string, minLength: 1, maxLength: 1024, pattern: '^[A-Za-z0-9_-]+$'}
      responses:
        '200': {$ref: '#/components/responses/EventPage'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runId}:
    parameters:
    - {$ref: '#/components/parameters/runId'}
    put:
      operationId: prepareAnalysis
      description: Повтор runId возвращает существующий анализ; правила задаёт Detector.
      responses:
        '201': {$ref: '#/components/responses/AnalysisStatus'}
        '200': {$ref: '#/components/responses/AnalysisStatus'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: getAnalysisStatus
      description: COMPLETED - все логи обработаны; observedRequestIds доступны только тогда.
      responses:
        '200': {$ref: '#/components/responses/AnalysisStatus'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runId}/log-batches:
    parameters:
    - {$ref: '#/components/parameters/runId'}
    post:
      operationId: ingestLogs
      description: >-
        204 после сохранения всей пачки. ACCEPTING принимает новые записи;
        FINISHING принимает только sequence в объявленных границах. После COMPLETED/FAILED
        допустимы только уже сохранённые идентичные повторы. Конфликт содержания,
        выход за границу или новая запись после завершения - 409; вся пачка отклоняется.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ./schemas/logs.yaml#/$defs/LogBatch}
      responses:
        '204': {description: 'Все записи сохранены, включая уже принятые повторы.'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runId}/finish:
    parameters:
    - {$ref: '#/components/parameters/runId'}
    put:
      operationId: finishAnalysis
      description: >-
        Фиксирует границы и deadlineAt, ждёт непрерывные 1..N обоих producers.
        Граница ниже уже сохранённого sequence или изменённый повтор - 409 без смены состояния.
        Идентичный повтор возвращает текущее состояние. После COMPLETED логи и инциденты неизменяемы.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ./schemas/detector.yaml#/$defs/FinishAnalysisRequest}
      responses:
        '202': {$ref: '#/components/responses/AnalysisStatus'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runId}/incidents:
    parameters:
    - {$ref: '#/components/parameters/runId'}
    get:
      operationId: listFinalIncidents
      description: 'Только итоговые после COMPLETED; иначе 409. Порядок: detectedAt, incidentId.'
      parameters:
      - {$ref: '#/components/parameters/limit'}
      - {$ref: '#/components/parameters/offset'}
      responses:
        '200': {$ref: '#/components/responses/IncidentPage'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  responses:
    EventPage:
      content:
        application/json:
          schema: {$ref: ./schemas/detector.yaml#/$defs/EventPage}
      description: Страница сохранённых событий.
    AnalysisStatus:
      content:
        application/json:
          schema: {$ref: ./schemas/detector.yaml#/$defs/AnalysisStatus}
      description: OK
    IncidentPage:
      content:
        application/json:
          schema: {$ref: ./schemas/detector.yaml#/$defs/IncidentPage}
      description: OK
    Error:
      description: Ошибка
      content:
        application/problem+json:
          schema: {$ref: ./schemas/common.yaml#/$defs/Problem}
  parameters:
    runId:
      name: runId
      in: path
      schema: {type: string, format: uuid}
      required: true
    limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
  securitySchemes:
    ServiceBearer: {type: http, scheme: bearer}
