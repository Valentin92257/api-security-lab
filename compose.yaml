name: api-security-lab

services:
  lab-control:
    extends:
      file: compose.common.yaml
      service: java-service
    build:
      context: .
      dockerfile: apps/lab-control/Dockerfile
    environment:
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-lab_admin}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LAB_OPERATOR_TOKEN: ${LAB_OPERATOR_TOKEN:?Set LAB_OPERATOR_TOKEN in .env}
      LAB_CONTROL_DB_PASSWORD: ${LAB_CONTROL_DB_PASSWORD:?Set LAB_CONTROL_DB_PASSWORD in .env}
      LAB_DETECTOR_CONTROL_TOKEN: ${LAB_DETECTOR_CONTROL_TOKEN:?Set LAB_DETECTOR_CONTROL_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LAB_CONTROL_PORT:-8080}:8080"
    networks: [ control-public, lab-traffic, shop-admin, lab-data, lab-observe, lab-ingest ]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lab_control
      POSTGRES_USER: ${POSTGRES_USER:-lab_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LAB_CONTROL_DB_PASSWORD: ${LAB_CONTROL_DB_PASSWORD:?Set LAB_CONTROL_DB_PASSWORD in .env}
      LAB_DETECTOR_DB_PASSWORD: ${LAB_DETECTOR_DB_PASSWORD:?Set LAB_DETECTOR_DB_PASSWORD in .env}
      LAB_DETECTOR_MIGRATION_PASSWORD: ${LAB_DETECTOR_MIGRATION_PASSWORD:?Set LAB_DETECTOR_MIGRATION_PASSWORD in .env}
    volumes:
      - control-data:/var/lib/postgresql/data
      - ./db/init/bootstrap.sql:/docker-entrypoint-initdb.d/20-databases.sql:ro
      - ./db/control/role.sql:/docker-entrypoint-initdb.d/10-control.sql:ro
      - ./db/detector/bootstrap.sql:/docker-entrypoint-initdb.d/15-detector.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ lab-data ]

  lab-gateway:
    extends:
      file: compose.common.yaml
      service: java-service
    build:
      context: .
      dockerfile: apps/lab-gateway/Dockerfile
    volumes:
      - lab-gateway-decisions:/app/logs
    environment:
      DECISION_LOG_PATH: /app/logs/decisions.jsonl
      SERVER_PORT: "8081"
      GATEWAY_ADDITIONAL_PORT: "8082"
      SHOP_PROTECTED_URL: "${SHOP_PROTECTED_URL:-http://shop-protected:8080}"
      GATEWAY_CONNECT_TIMEOUT: "${GATEWAY_CONNECT_TIMEOUT:-2s}"
      GATEWAY_UPSTREAM_TIMEOUT: "${GATEWAY_UPSTREAM_TIMEOUT:-5s}"
      GATEWAY_MAX_BODY_BYTES: "${GATEWAY_MAX_BODY_BYTES:-8388608}"
      GATEWAY_JWT_SECRET: ${JWT_SECRET_PROTECTED:?Set JWT_SECRET_PROTECTED in .env}
      LAB_DETECTOR_GATEWAY_TOKEN: ${LAB_DETECTOR_GATEWAY_TOKEN:?Set LAB_DETECTOR_GATEWAY_TOKEN in .env}
    expose: ["8081", "8082"]
    networks: [lab-traffic, shop-backend, shop-admin, lab-observe, lab-ingest]

  shop-vulnerable:
    extends:
      file: compose.common.yaml
      service: java-service
    image: api-security-lab/shop-api:dev
    build:
      context: .
      dockerfile: apps/shop-api/Dockerfile
    volumes:
      - shop-vulnerable-decisions:/app/logs
    environment:
      DECISION_LOG_PATH: /app/logs/decisions.jsonl
      SPRING_PROFILES_ACTIVE: vulnerable
      LAB_DETECTOR_SHOP_TOKEN: ${LAB_DETECTOR_SHOP_TOKEN:?Set LAB_DETECTOR_SHOP_TOKEN in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-lab_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET_VULNERABLE:?Set JWT_SECRET_VULNERABLE in .env}
      IDEMPOTENCY_SECRET: ${IDEMPOTENCY_SECRET:?Set IDEMPOTENCY_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [ shop-backend, shop-admin, lab-data, lab-observe, lab-ingest ]

  shop-protected:
    extends:
      file: compose.common.yaml
      service: java-service
    image: api-security-lab/shop-api:dev
    volumes:
      - shop-protected-decisions:/app/logs
    environment:
      DECISION_LOG_PATH: /app/logs/decisions.jsonl
      SPRING_PROFILES_ACTIVE: protected
      LAB_DETECTOR_SHOP_TOKEN: ${LAB_DETECTOR_SHOP_TOKEN:?Set LAB_DETECTOR_SHOP_TOKEN in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-lab_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET_PROTECTED:?Set JWT_SECRET_PROTECTED in .env}
      IDEMPOTENCY_SECRET: ${IDEMPOTENCY_SECRET:?Set IDEMPOTENCY_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [ shop-backend, shop-admin, lab-data, lab-observe, lab-ingest ]

  lab-detector:
    extends:
      file: compose.common.yaml
      service: java-service
    build:
      context: .
      dockerfile: apps/lab-detector/Dockerfile
    environment:
      LAB_DETECTOR_CONTROL_TOKEN: ${LAB_DETECTOR_CONTROL_TOKEN:?Set LAB_DETECTOR_CONTROL_TOKEN in .env}
      LAB_DETECTOR_GATEWAY_TOKEN: ${LAB_DETECTOR_GATEWAY_TOKEN:?Set LAB_DETECTOR_GATEWAY_TOKEN in .env}
      LAB_DETECTOR_SHOP_TOKEN: ${LAB_DETECTOR_SHOP_TOKEN:?Set LAB_DETECTOR_SHOP_TOKEN in .env}
      LAB_DETECTOR_DB_PASSWORD: ${LAB_DETECTOR_DB_PASSWORD:?Set LAB_DETECTOR_DB_PASSWORD in .env}
      LAB_DETECTOR_MIGRATION_PASSWORD: ${LAB_DETECTOR_MIGRATION_PASSWORD:?Set LAB_DETECTOR_MIGRATION_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [ lab-data, lab-observe, lab-ingest ]

networks:
  # Only lab-control joins this network: Docker publishes ports only for containers on a non-internal network.
  control-public: {}
  lab-traffic:
    internal: true
  shop-backend:
    internal: true
  shop-admin:
    internal: true
  lab-data:
    internal: true
  lab-observe:
    internal: true
  lab-ingest:
    internal: true

volumes:
  lab-gateway-decisions:
  shop-vulnerable-decisions:
  shop-protected-decisions:
  control-data:
