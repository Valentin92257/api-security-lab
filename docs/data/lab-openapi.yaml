          "$ref": "#/components/schemas/IncidentSummary"
    Incident:
      type: object
      additionalProperties: false
      required:
      - incidentId
      - partitionId
      - runId
      - category
      - technique
      - tags
      - severity
      - confidenceLevel
      - confidenceScore
      - ruleId
      - ruleVersion
      - rulesetHash
      - detectorVersion
      - method
      - analysisState
      - status
      - revision
      - impactStatus
      - summary
      - evidenceEventIds
      - history
      - createdAt
      - detectedAt
      - updatedAt
      properties:
        incidentId:
          "$ref": "#/components/schemas/Uuid"
        partitionId:
          "$ref": "#/components/schemas/Uuid"
        runId:
          "$ref": "#/components/schemas/Uuid"
        category:
          "$ref": "#/components/schemas/Category"
        technique:
          type: string
          maxLength: 120
          minLength: 1
        tags:
          type: array
          items:
            type: string
            maxLength: 80
            minLength: 1
          minItems: 0
          maxItems: 32
          uniqueItems: true
        severity:
          "$ref": "#/components/schemas/Severity"
        confidenceLevel:
          type: string
          enum:
          - UNKNOWN
          - LOW
          - MEDIUM
          - HIGH
        confidenceScore:
          type: 'null'
        ruleId:
          type: string
          maxLength: 120
          minLength: 1
        ruleVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        rulesetHash:
          "$ref": "#/components/schemas/Hash"
        detectorVersion:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          maxLength: 120
          minLength: 1
        method:
          type: string
          enum:
          - RULE
          - CORRELATION
        analysisState:
          "$ref": "#/components/schemas/AnalysisState"
        status:
          "$ref": "#/components/schemas/IncidentStatus"
        revision:
          "$ref": "#/components/schemas/Revision"
        impactStatus:
          type: string
          enum:
          - SUSPECTED
          - UNKNOWN
        summary:
          "$ref": "#/components/schemas/IncidentSummary"
        evidenceEventIds:
          type: array
          items:
            "$ref": "#/components/schemas/Uuid"
          minItems: 0
          maxItems: 4096
          uniqueItems: true
        history:
          type: array
          items:
            "$ref": "#/components/schemas/HistoryEntry"
          minItems: 1
          maxItems: 1024
        createdAt:
          "$ref": "#/components/schemas/Time"
        detectedAt:
          "$ref": "#/components/schemas/Time"
        updatedAt:
          "$ref": "#/components/schemas/Time"
      description: runId добавляет control для оператора; detector его не получает
        из этой проекции. AnalysisState и impactStatus меняет detector, operator status
        — только PATCH. Оператор не может присвоить TP/FP или подтвердить эффект.
    IncidentUpdate:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - commandId
      - expectedRevision
      - status
      - comment
      - resolution
      properties:
        schemaVersion:
          type: integer
          const: 1
        commandId:
          "$ref": "#/components/schemas/Uuid"
        expectedRevision:
          "$ref": "#/components/schemas/Revision"
        status:
          "$ref": "#/components/schemas/IncidentStatus"
        comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
        resolution:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
      description: OPEN→ACKNOWLEDGED/RESOLVED; ACKNOWLEDGED→OPEN/RESOLVED; RESOLVED→OPEN.
        Тот же status разрешён с непустым comment; RESOLVED требует непустой resolution,
        иначе resolution=null. CAS с detector updates; журнал append-only, revision+1.
        Повтор commandId возвращает сохранённый ответ без второй history entry. CommandId/fingerprint/result
        хранит control в приватной записи command_journal связанного run; JSONB-поле
        уже существует. Сравнение payload, CAS и запись history выполняются одной
        транзакцией.
    PolicyFact:
      type: object
      additionalProperties: false
      required:
      - policyId
      - policyVersion
      - mode
      - evaluationStatus
      - wouldDecision
      - enforcedAction
      - reasonCode
      properties:
        policyId:
          type: string
          maxLength: 80
          minLength: 1
        policyVersion:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          maxLength: 120
          minLength: 1
        mode:
          "$ref": "#/components/schemas/PolicyMode"
        evaluationStatus:
          type: string
          enum:
          - EVALUATED
          - SKIPPED
          - NOT_APPLICABLE
          - NOT_REACHED
          - MISSING_CONTEXT
          - ERROR
        wouldDecision:
          anyOf:
          - type: string
            enum:
            - ALLOW
            - FLAG
            - BLOCK
          - type: 'null'
        enforcedAction:
          type: string
          enum:
          - CONTINUE
          - REJECT
          - INFRA_REJECT
        reasonCode:
          type: string
          maxLength: 80
          minLength: 1
      description: 'OFF: SKIPPED, wouldDecision=null, CONTINUE. wouldDecision задан
        только при EVALUATED. OBSERVE: EVALUATED и CONTINUE; ENFORCE+BLOCK: REJECT.
        Ошибка инфраструктуры: INFRA_REJECT; последующие невыполненные проверки: NOT_REACHED.
        FLAG не создаёт incident автоматически.'
      allOf:
      - if:
          properties:
            evaluationStatus:
              const: EVALUATED
        then:
          properties:
            wouldDecision:
              type: string
              enum:
              - ALLOW
              - FLAG
              - BLOCK
        else:
          properties:
            wouldDecision:
              type: 'null'
    Observations:
      type: object
      additionalProperties: false
      required: []
      properties:
        subjectMatchesOwner:
          anyOf:
          - type: boolean
          - type: 'null'
        downstreamInvoked:
          type: boolean
        operationExecuted:
          type: boolean
        stateChanged:
          type: boolean
        quantityWithinBounds:
          type: boolean
        quoteMatchesServer:
          type: boolean
        couponEligibility:
          type: string
          enum:
          - VALID
          - EXPIRED
          - EXHAUSTED
          - NONE
          - UNKNOWN
        idempotencyOutcome:
          type: string
          enum:
          - NEW
          - REPLAYED
          - CONFLICT
          - NONE
        authOutcome:
          type: string
          enum:
          - SUCCESS
          - FAILURE
        accountKey:
          "$ref": "#/components/schemas/Hash"
        idempotencyKeyHash:
          "$ref": "#/components/schemas/Hash"
        cartKey:
          "$ref": "#/components/schemas/Hash"
        cartRevision:
          "$ref": "#/components/schemas/Revision"
        orderId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        validationCategories:
          type: array
          items:
            type: string
            enum:
            - SQL_LIKE
            - TYPE_MISMATCH
            - UNKNOWN_FIELD
            - QUANTITY_OUT_OF_RANGE
          minItems: 0
          maxItems: 4
          uniqueItems: true
      description: Только allowlist фактов. Отсутствие поля означает неприменимость/неполноту,
        не false. CHECKOUT обязан содержать cartKey/cartRevision/idempotencyKeyHash/stateChanged;
        effect — orderId. Условия обязательности контролирует JSONL validator.
    EventView:
      type: object
      additionalProperties: false
      required:
      - eventId
      - runId
      - requestId
      - traceId
