        required: true
        schema:
          "$ref": "#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/StartCommand"
            example:
              schemaVersion: 1
              commandId: ecdc14c1-3b1a-464d-956f-75a9c728f640
              epoch: e42fb0db-45dc-4b1a-8157-66c3a815e450
              expectedRevision: 0
              expectedState: CREATED
