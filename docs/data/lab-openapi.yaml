      operationId: listExperiments
      tags:
      - Experiments
      summary: Список экспериментов
      description: createdAt DESC, experimentId DESC. Offset-pagination отражает состояние
        на момент запроса; при живых изменениях UI обновляет первую страницу.
      responses:
        '200':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExperimentPage"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
