x-contract-decisions:
- OperatorBearer выбран для локального MVP; session/cookie auth не вводится.
- Catalog/list/events/incidents/comparison уточняют ранее описанные возможности UI.
- epoch experiment равен experimentId, revision выводится из наличия runs; новая таблица
  не нужна.
- Command journal использует JSONB control.runs.command_journal; общий лимит 1024
  записей действует на start/cancel/incident commands.
- Внутренние management HTTP-команды gateway/shop и JSONL здесь намеренно не представлены
  как публичные операции.
