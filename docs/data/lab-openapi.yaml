          - lab.http.request.started.v1
          - lab.http.request.completed.v1
          - lab.api.request.started.v1
          - lab.api.request.completed.v1
          - lab.policy.evaluated.v1
          - lab.auth.attempted.v1
          - lab.object.accessed.v1
          - lab.operation.completed.v1
          - lab.input.observed.v1
        producer:
