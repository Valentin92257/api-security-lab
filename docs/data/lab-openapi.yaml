  "/runs/{runId}/cancel":
    post:
      operationId: cancelRun
      tags:
      - Runs
      summary: Принять отмену прогона
      description: |-
        epoch/revision/state берутся из GET run. Cancel прекращает новые попытки, затем выполняет DRAINING; не отменяет уже committed orders и не обещает немедленную остановку SQL.

        409: STATE_CONFLICT, REVISION_CONFLICT, EPOCH_MISMATCH, COMMAND_CONFLICT.
      responses:
        '202':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CancelAccepted"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
