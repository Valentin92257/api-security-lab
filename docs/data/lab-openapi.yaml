        receivedAt:
          "$ref": "#/components/schemas/Time"
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - HEAD
          - OPTIONS
        route:
          type: string
          maxLength: 256
          minLength: 1
        reasonCode:
          anyOf:
          - type: string
            maxLength: 80
            minLength: 1
          - type: 'null'
        httpStatus:
          anyOf:
          - type: integer
            format: int64
            minimum: 100
            maximum: 599
          - type: 'null'
        policy:
          anyOf:
          - "$ref": "#/components/schemas/PolicyFact"
          - type: 'null'
        observations:
          "$ref": "#/components/schemas/Observations"
      description: Безопасная UI-проекция JSONL, не raw payload/приёмник логов. У
        start reasonCode/httpStatus=null; start — не успех операции.
