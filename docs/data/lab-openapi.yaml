          format: int64
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000
          default: 0
      - name: requestId
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/Uuid"
      - name: scenarioId
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/ScenarioId"
      - name: route
        in: query
