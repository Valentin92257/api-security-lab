      - Experiments
      summary: Создать неизменяемый эксперимент
      description: '400 для неизвестной версии, повторного scenario id, несовместимости
        fixtures или превышения /catalog limits. Не запускает нагрузку. POST создания
        не идемпотентен: после потери ответа сначала сверить список experiments, не
        повторять автоматически.'
      responses:
        '201':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExperimentCreated"
              example:
                experimentId: e42fb0db-45dc-4b1a-8157-66c3a815e450
                definitionHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                state: CREATED
                epoch: e42fb0db-45dc-4b1a-8157-66c3a815e450
                revision: 0
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
        '415':
          "$ref": "#/components/responses/Error415"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExperimentDefinition"
            example:
              name: Проверка BOLA
              scenarioRefs:
              - id: BO-01
                version: 1
              - id: BO-02
                version: 1
              targets:
              - VULNERABLE
              - PROTECTED
              seed: 42
              fixtureVersion: shop-demo-v1
              policyProfile: baseline-vs-enforce-v1
              rulesetVersion: rules-v1
              execution:
                parallelism: 1
                repetitions: 1
