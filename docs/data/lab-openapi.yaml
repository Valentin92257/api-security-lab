      description: |-
        CAS по expectedRevision; analysisState/severity/impact/TP-FP не принимаются. actor определяется operator credential. История append-only. Replay commandId проверяется до CAS.

        409: REVISION_CONFLICT, STATE_CONFLICT, COMMAND_CONFLICT, HISTORY_LIMIT_REACHED.
      responses:
        '200':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Incident"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
        '415':
          "$ref": "#/components/responses/Error415"
        '409':
          "$ref": "#/components/responses/Error409"
      parameters:
      - name: incidentId
        in: path
        required: true
        schema:
          "$ref": "#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/IncidentUpdate"
            example:
              schemaVersion: 1
              commandId: 193e15b5-4bfe-48ab-98bc-7f7f423c2d93
              expectedRevision: 2
              status: ACKNOWLEDGED
              comment: Проверено оператором
              resolution:
  "/runs/{runId}/report":
    get:
      operationId: getRunReport
      tags:
      - Reports
      summary: Просмотреть или скачать JSON-отчёт
      description: |-
        Без revision — последняя опубликованная; revision фиксирует immutable результат. download=true возвращает тот же JSON с Content-Disposition: attachment; filename формирует сервер из runId/revision. Неизвестная revision готового отчёта — 404. Диагностические partial results обозначены INCONCLUSIVE, не итоговым успехом.

        409: REPORT_NOT_READY: опубликованного отчёта ещё нет.
      responses:
        '200':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
            Content-Disposition:
              schema:
                type: string
              description: 'При download=true: attachment; filename="report-<runId>-r<revision>.json";
                имя формируется сервером.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Report"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
        '409':
          "$ref": "#/components/responses/Error409"
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          "$ref": "#/components/schemas/Uuid"
      - name: revision
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          default: false
  "/experiments/{experimentId}/comparison":
    get:
      operationId: getExperimentComparison
      tags:
      - Reports
      summary: Сравнить paired runs до/после
      description: |-
        Доступно только для обоих targets и всех соответствующих COMPLETED runs с COMPLETE reports. Пары по repetition; контракты workload/fixture/ruleset сверяются. Нельзя трактовать частичный run как корректную точку сравнения.

        409: COMPARISON_NOT_READY, TARGET_PAIR_REQUIRED, RUNS_NOT_COMPARABLE.
      responses:
        '200':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Comparison"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
        '409':
          "$ref": "#/components/responses/Error409"
      parameters:
      - name: experimentId
        in: path
        required: true
        schema:
          "$ref": "#/components/schemas/Uuid"
components:
  securitySchemes:
    OperatorBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque local operator token
      description: Отдельный credential локального оператора. Не принимает shop JWT,
        run или management credential.
  headers:
    RequestId:
      description: UUID текущего HTTP-attempt, присутствует во всех ответах.
      schema:
        type: string
        format: uuid
  responses:
    Error400:
      description: 'VALIDATION_FAILED: синтаксис, типы, неизвестные или повторяющиеся
        поля/query, bounds.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: VALIDATION_FAILED
            status: 400
            code: VALIDATION_FAILED
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error401:
      description: 'AUTH_REQUIRED: отсутствующий или недействительный credential.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer challenge; обязателен.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:auth-required
            title: AUTH_REQUIRED
            status: 401
            code: AUTH_REQUIRED
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error403:
      description: 'FORBIDDEN: недостаточные полномочия или недопустимый Origin.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: FORBIDDEN
            status: 403
            code: FORBIDDEN
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error404:
      description: 'NOT_FOUND: объект отсутствует либо недоступен.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: NOT_FOUND
            status: 404
            code: NOT_FOUND
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error405:
      description: 'METHOD_NOT_ALLOWED: метод не поддерживается для существующего
        маршрута.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
        Allow:
          schema:
            type: string
          description: Поддерживаемые методы; обязателен.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: METHOD_NOT_ALLOWED
            status: 405
            code: METHOD_NOT_ALLOWED
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error409:
      description: Конфликт состояния или уникальности; конкретные code перечислены
        у операции.
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: Конфликт состояния или уникальности; конкретные code перечислены
              у операции.
            status: 409
            code: STATE_CONFLICT
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error413:
      description: 'PAYLOAD_TOO_LARGE: превышен настроенный бюджет тела.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: PAYLOAD_TOO_LARGE
            status: 413
            code: PAYLOAD_TOO_LARGE
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error415:
      description: 'UNSUPPORTED_MEDIA_TYPE: требуется application/json.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: UNSUPPORTED_MEDIA_TYPE
            status: 415
            code: UNSUPPORTED_MEDIA_TYPE
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error429:
      description: 'RATE_LIMITED: превышен лимит; Retry-After в секундах.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
        Retry-After:
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: Количество секунд; обязателен.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: RATE_LIMITED
            status: 429
            code: RATE_LIMITED
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error500:
      description: 'INTERNAL_ERROR: без SQL, stack trace или секретов.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: INTERNAL_ERROR
            status: 500
            code: INTERNAL_ERROR
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error503:
      description: DEPENDENCY_UNAVAILABLE либо RUN_CLOSED; инфраструктурный отказ
        не считается предотвращённой атакой.
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: DEPENDENCY_UNAVAILABLE либо RUN_CLOSED; инфраструктурный отказ
              не считается предотвращённой атакой.
            status: 503
            code: DEPENDENCY_UNAVAILABLE
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
  schemas:
    Uuid:
      type: string
      format: uuid
    Time:
      type: string
      format: date-time
      pattern: Z$
      description: UTC RFC 3339, окончание Z.
    Revision:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    Hash:
      type: string
      pattern: "^[a-f0-9]{64}$"
      maxLength: 64
      minLength: 64
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - requestId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 240
          minLength: 1
        status:
          type: integer
          format: int64
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          maxLength: 80
          minLength: 1
        requestId:
          "$ref": "#/components/schemas/Uuid"
    Target:
      type: string
      enum:
      - VULNERABLE
      - PROTECTED
    RunState:
      type: string
      enum:
      - CREATED
      - PREPARING
      - RUNNING
      - DRAINING
      - EVALUATING
      - COMPLETED
      - FAILED
      - CANCELLED
      - INCONCLUSIVE
    Category:
      type: string
      enum:
      - AUTHENTICATION_ABUSE
      - ACCESS_CONTROL
      - REPLAY
      - INJECTION
      - BUSINESS_ABUSE
    ScenarioId:
      type: string
      enum:
      - CS-01
      - CS-02
      - BO-01
      - BO-02
      - RP-01
      - RP-02
      - IJ-01
      - BL-01
      - BL-02
      - BL-03
      - BL-04
    Severity:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
    IncidentStatus:
      type: string
      enum:
      - OPEN
      - ACKNOWLEDGED
      - RESOLVED
    AnalysisState:
      type: string
      enum:
      - PROVISIONAL
      - FINAL
      - RETRACTED
    PolicyMode:
      type: string
      enum:
      - 'OFF'
      - OBSERVE
      - ENFORCE
    Effect:
      type: string
      enum:
      - EFFECT_OBSERVED
      - EFFECT_NOT_OBSERVED
      - ERROR
      - INCONCLUSIVE
    Rate:
      type: number
      minimum: 0
      maximum: 1
    Reason:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          maxLength: 80
          minLength: 1
        message:
          type: string
          maxLength: 1000
          minLength: 1
    ScenarioRef:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      properties:
        id:
          "$ref": "#/components/schemas/ScenarioId"
        version:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
    Execution:
      type: object
      additionalProperties: false
      required:
      - parallelism
      - repetitions
      properties:
        parallelism:
          type: integer
          format: int64
          minimum: 1
          maximum: 256
        repetitions:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
      description: Технические потолки контракта; GET /catalog сообщает более низкие
        бюджеты текущего стенда. Конкурентность сценария внутри run, не несколько
        активных runs.
    ExperimentDefinition:
      type: object
      additionalProperties: false
      required:
      - name
      - scenarioRefs
      - targets
      - seed
      - fixtureVersion
      - policyProfile
      - rulesetVersion
      - execution
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
        scenarioRefs:
          type: array
          items:
            "$ref": "#/components/schemas/ScenarioRef"
          minItems: 1
          maxItems: 32
          uniqueItems: true
        targets:
          type: array
          items:
            "$ref": "#/components/schemas/Target"
          minItems: 1
          maxItems: 2
          uniqueItems: true
        seed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        fixtureVersion:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          maxLength: 120
          minLength: 1
        policyProfile:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          maxLength: 120
          minLength: 1
        rulesetVersion:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          maxLength: 120
          minLength: 1
        execution:
          "$ref": "#/components/schemas/Execution"
      description: Только опубликованные версии GET /catalog; по одному ref на scenario
        id. Произвольные URL, SQL, callbacks, actors и executable code не принимаются.
        Actors выбирает plan по fixture manifest.
    ExperimentCreated:
      type: object
      additionalProperties: false
      required:
      - experimentId
      - definitionHash
      - state
      - epoch
      - revision
      properties:
        experimentId:
          "$ref": "#/components/schemas/Uuid"
        definitionHash:
          "$ref": "#/components/schemas/Hash"
        state:
          type: string
          const: CREATED
        epoch:
          "$ref": "#/components/schemas/Uuid"
        revision:
          type: integer
          const: 0
      description: epoch=experimentId — неизменяемая управляющая эпоха experiment
        для start, не эпоха отдельного run. UUID создаёт control.
    Experiment:
      type: object
      additionalProperties: false
      required:
      - experimentId
      - definitionHash
      - definition
      - state
      - epoch
      - revision
      - createdAt
      - runIds
      properties:
        experimentId:
          "$ref": "#/components/schemas/Uuid"
        definitionHash:
          "$ref": "#/components/schemas/Hash"
        definition:
          "$ref": "#/components/schemas/ExperimentDefinition"
        state:
          type: string
          enum:
          - CREATED
          - STARTED
        epoch:
          "$ref": "#/components/schemas/Uuid"
        revision:
          "$ref": "#/components/schemas/Revision"
        createdAt:
          "$ref": "#/components/schemas/Time"
        runIds:
          type: array
          items:
            "$ref": "#/components/schemas/Uuid"
          minItems: 0
          maxItems: 200
          uniqueItems: true
      description: CREATED/STARTED — состояние запуска definition. Итог выполнения
        определяется связанными runs; definition не меняется. epoch=experimentId;
        revision=0 до старта и 1 после. Эти поля выводятся из состояния, не требуют
        новых SQL-столбцов. Start command/result атомарно сохраняются в command_journal
        первого созданного run; unique(experiment_id,target,repetition) и сериализация
        старта предотвращают повторное создание.
    StartCommand:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - commandId
      - epoch
      - expectedRevision
      - expectedState
      properties:
        schemaVersion:
          type: integer
          const: 1
        commandId:
          "$ref": "#/components/schemas/Uuid"
        epoch:
          "$ref": "#/components/schemas/Uuid"
        expectedRevision:
          "$ref": "#/components/schemas/Revision"
        expectedState:
          type: string
          const: CREATED
    StartAccepted:
      type: object
      additionalProperties: false
      required:
      - experimentId
      - runIds
      - commandId
      - revision
      properties:
        experimentId:
          "$ref": "#/components/schemas/Uuid"
        runIds:
          type: array
          items:
            "$ref": "#/components/schemas/Uuid"
          minItems: 1
          maxItems: 200
          uniqueItems: true
        commandId:
          "$ref": "#/components/schemas/Uuid"
        revision:
          "$ref": "#/components/schemas/Revision"
    Progress:
      type: object
      additionalProperties: false
      required:
      - plannedSteps
      - finishedSteps
      - attempts
      - percent
      properties:
        plannedSteps:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        finishedSteps:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        attempts:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        percent:
          type: number
          minimum: 0
          maximum: 100
      description: percent по завершённым плановым шагам; retries не увеличивают plannedSteps.
        100% нагрузки не означает завершения DRAINING/evaluation.
    Run:
      type: object
      additionalProperties: false
      required:
      - runId
      - experimentId
      - target
      - repetition
      - epoch
      - revision
      - state
      - progress
      - cleanupSafe
      - failureReason
      - reportId
      - createdAt
      - finishedAt
      properties:
        runId:
          "$ref": "#/components/schemas/Uuid"
        experimentId:
          "$ref": "#/components/schemas/Uuid"
        target:
          "$ref": "#/components/schemas/Target"
        repetition:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        epoch:
          "$ref": "#/components/schemas/Uuid"
        revision:
          "$ref": "#/components/schemas/Revision"
        state:
          "$ref": "#/components/schemas/RunState"
        progress:
          "$ref": "#/components/schemas/Progress"
        cleanupSafe:
          type: boolean
        failureReason:
          anyOf:
          - "$ref": "#/components/schemas/Reason"
          - type: 'null'
        reportId:
          anyOf:
          - "$ref": "#/components/schemas/Uuid"
          - type: 'null'
        createdAt:
          "$ref": "#/components/schemas/Time"
        finishedAt:
          anyOf:
          - "$ref": "#/components/schemas/Time"
          - type: 'null'
    CancelCommand:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - commandId
      - epoch
      - expectedRevision
      - expectedState
