  "/experiments/{experimentId}/start":
    post:
      operationId: startExperiment
      tags:
      - Experiments
      summary: Принять запуск эксперимента
      description: |-
        epoch/revision берутся из Experiment. Все runIds сохраняются до 202, runs выполняются последовательно. Новый start после STARTED запрещён; повтор принятого commandId возвращает прежний результат. Очередь разных experiments не предусмотрена.

        409: ACTIVE_RUN, CLEANUP_UNSAFE, STATE_CONFLICT, REVISION_CONFLICT, EPOCH_MISMATCH, COMMAND_CONFLICT.
      responses:
        '202':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
