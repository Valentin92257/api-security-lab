            schema:
              "$ref": "#/components/schemas/CancelCommand"
            example:
              schemaVersion: 1
              commandId: fcf672ac-ff67-41ac-a68e-438fe6babbed
              epoch: 447c5978-23ee-49f0-862b-625b00bc3fd2
              expectedRevision: 3
              expectedState: RUNNING
  "/runs/{runId}/events":
    get:
      operationId: listRunEvents
      tags:
      - Runs
      summary: Безопасная хронология событий
      description: occurredAt ASC,eventId ASC; from включительно, to исключительно,
        from<to. route — точное совпадение шаблона; фильтры AND. scenarioId присоединяет
        control по attempts/plan, не detector. decision фильтрует policy.wouldDecision,
        поэтому BLOCK в OBSERVE не означает блокировку. Это чтение безопасной проекции,
        не raw audit export.
      responses:
        '200':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
