    ConfigurationSnapshot:
      type: object
      additionalProperties: false
      required:
      - kind
      - version
      - hash
      - content
      properties:
        kind:
          type: string
          enum:
          - PLAN
          - FIXTURE
          - POLICIES
          - RULESET
          - COMPONENTS
        version:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          maxLength: 120
          minLength: 1
        hash:
          "$ref": "#/components/schemas/Hash"
        content:
          type: string
          maxLength: 1000000
          minLength: 1
      description: Полный безопасный snapshot в canonical JSON, сериализованном строкой;
        без passwords/tokens/raw requests. Hash относится к UTF-8 content. PLAN/FIXTURE
        экспортируются с удалёнными секретами; исходные private hashes отдельно в
        Provenance. Содержимое не исполняется и не подаётся detector.
    Provenance:
      type: object
      additionalProperties: false
      required:
      - definitionHash
      - planHash
      - fixtureHash
      - policyHash
      - rulesetHash
      - snapshotHash
      - evaluatorVersion
      - seed
      - businessTimeBase
      - snapshots
      properties:
        definitionHash:
          "$ref": "#/components/schemas/Hash"
        planHash:
          anyOf:
          - "$ref": "#/components/schemas/Hash"
          - type: 'null'
        fixtureHash:
          anyOf:
          - "$ref": "#/components/schemas/Hash"
          - type: 'null'
        policyHash:
          anyOf:
          - "$ref": "#/components/schemas/Hash"
          - type: 'null'
        rulesetHash:
          anyOf:
          - "$ref": "#/components/schemas/Hash"
          - type: 'null'
        snapshotHash:
          anyOf:
          - "$ref": "#/components/schemas/Hash"
          - type: 'null'
        evaluatorVersion:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          maxLength: 120
          minLength: 1
        seed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        businessTimeBase:
          "$ref": "#/components/schemas/Time"
        snapshots:
          type: array
          items:
            "$ref": "#/components/schemas/ConfigurationSnapshot"
          minItems: 0
          maxItems: 16
    Report:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - reportId
      - revision
      - experimentId
      - runId
      - target
      - state
      - cleanupSafe
      - completeness
      - createdAt
      - startedAt
      - finishedAt
      - provenance
      - caseResults
      - episodeResults
      - incidentAssessments
      - policyDecisions
      - metrics
      - coverage
      - residualRisks
      properties:
        schemaVersion:
          type: integer
          const: 1
        reportId:
          "$ref": "#/components/schemas/Uuid"
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        experimentId:
          "$ref": "#/components/schemas/Uuid"
        runId:
          "$ref": "#/components/schemas/Uuid"
        target:
          "$ref": "#/components/schemas/Target"
        state:
          "$ref": "#/components/schemas/RunState"
        cleanupSafe:
          type: boolean
        completeness:
          type: string
          enum:
          - COMPLETE
          - INCONCLUSIVE
        createdAt:
          "$ref": "#/components/schemas/Time"
        startedAt:
          anyOf:
          - "$ref": "#/components/schemas/Time"
          - type: 'null'
        finishedAt:
          anyOf:
          - "$ref": "#/components/schemas/Time"
          - type: 'null'
        provenance:
          "$ref": "#/components/schemas/Provenance"
        caseResults:
          type: array
          items:
            "$ref": "#/components/schemas/CaseResult"
          minItems: 0
          maxItems: 10000
        episodeResults:
          type: array
          items:
            "$ref": "#/components/schemas/EpisodeResult"
          minItems: 0
          maxItems: 10000
        incidentAssessments:
          type: array
          items:
            "$ref": "#/components/schemas/IncidentAssessment"
          minItems: 0
          maxItems: 10000
        policyDecisions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - policyId
            - policyVersion
            - mode
            - evaluatedCount
            - skippedCount
            - blockedCount
            - flaggedCount
            properties:
              policyId:
                type: string
                maxLength: 80
                minLength: 1
              policyVersion:
                type: string
                pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
                maxLength: 120
                minLength: 1
              mode:
                "$ref": "#/components/schemas/PolicyMode"
              evaluatedCount:
                type: integer
                format: int64
                minimum: 0
                maximum: 9007199254740991
              skippedCount:
                type: integer
                format: int64
                minimum: 0
                maximum: 9007199254740991
              blockedCount:
                type: integer
                format: int64
                minimum: 0
                maximum: 9007199254740991
              flaggedCount:
                type: integer
                format: int64
                minimum: 0
                maximum: 9007199254740991
          minItems: 0
          maxItems: 100
        metrics:
          "$ref": "#/components/schemas/Metrics"
        coverage:
          "$ref": "#/components/schemas/Coverage"
        residualRisks:
          type: array
          items:
            type: string
            maxLength: 2000
            minLength: 1
          minItems: 0
          maxItems: 100
      description: Immutable revision. Экспорт и просмотр возвращают один объект;
        body не содержит собственный hash (нет самоссылки). Политики и метрики — evaluator,
        не статус HTTP. При раннем отказе подготовки snapshots могут быть пустыми,
        отсутствующие hashes — null. COMPLETE требует всех provenance hashes, конечного
        snapshotHash и полного набора безопасных snapshots. Диагностический отчёт
        допускает completeness INCONCLUSIVE; final сравнение требует COMPLETED/COMPLETE.
      allOf:
      - if:
          properties:
            completeness:
              const: COMPLETE
        then:
          properties:
            provenance:
              properties:
                planHash:
                  "$ref": "#/components/schemas/Hash"
                fixtureHash:
                  "$ref": "#/components/schemas/Hash"
                policyHash:
                  "$ref": "#/components/schemas/Hash"
                rulesetHash:
                  "$ref": "#/components/schemas/Hash"
                snapshotHash:
                  "$ref": "#/components/schemas/Hash"
