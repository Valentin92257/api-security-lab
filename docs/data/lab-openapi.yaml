---
openapi: 3.1.0
info:
  title: API Security Lab — управление стендом
  version: 1.0.0
  description: |-
    Публичный API lab-control для дашборда и локального оператора. Это контракт реализации v1: он уточняет DTO, каталоги, пагинацию и CAS там, где design-doc задавал только семантику. Один активный run; paired runs выполняются последовательно. Эксперимент после создания неизменяем; start создаёт runIds один раз.
    Выбран способ operator-аутентификации: отдельный непрозрачный Bearer token из локальной конфигурации, не JWT магазина и не admin/run credential. Cookie-аутентификация не поддерживается; UI передаёт Authorization явно, хранит token только в памяти. CORS закрыт, unsafe запрос с посторонним Origin отклоняется 403; при будущем переходе на cookies потребуется отдельный CSRF-контракт. Опубликован только loopback listener.
    Runner — Java-модуль, detector получает SQL jobs: HTTP-эндпоинтов для них нет. /internal/v1/... gateway/shop — отдельный management interface и в этот публичный контракт не входит. JSONL — файловый протокол, не HTTP ingestion API.
    Объекты запросов закрытые; неизвестные/повторяющиеся query и JSON-поля запрещены. GET без тела. POST/PATCH требуют JSON. Все ответы и exports: Cache-Control:no-store; секреты, raw payloads и bearer не возвращаются. UUID и UTC RFC3339; revision — CAS. 202 означает принятие, не завершение. Управляющие retries проверяются по commandId и canonical payload до проверки устаревшей revision; другое тело того же commandId — 409 COMMAND_CONFLICT. Проверка, сохранение команды и переход состояния атомарны. Перезапуск процесса делает незавершённый run INCONCLUSIVE; resume не предоставляется.
servers:
- url: "/control/v1"
security:
- OperatorBearer: []
tags:
- name: Catalog
- name: Experiments
- name: Runs
- name: Incidents
- name: Reports
