---
openapi: 3.1.0
info:
  title: API Security Lab — магазин
  version: 1.0.0
  description: |-
    Нормативный контракт девяти операций для vulnerable и protected. Origins внутри стенда: http://lab-gateway:8081 и http://lab-gateway:8082; соответствие listener/target задаёт Compose. Protected соблюдает контракт; намеренные отклонения vulnerable служат предметом измерения, а не вторым нормативным API. Gateway schema policy может быть OFF/OBSERVE/ENFORCE; transport/admission/JWT остаются обязательными. Поле target/owner и клиентские заголовки не дают полномочий.
    Все ответы JSON, ошибки Problem. Объекты закрытые, неизвестные/повторяющиеся query и JSON-поля запрещены; строка не преобразуется в число. Для GET тело запрещено. Семантическая нормализация и длины UTF-8 проверяются приложением; x-* описывают дополнительные требования, которые OpenAPI-валидатор сам не исполняет. X-Request-Id выдаёт gateway; доверенный harness context проверяется отдельно и не задаётся обычным клиентом.
    Каталог и условия купонов фиксированы до отчёта. Деньги — целые рубли. Семь таблиц, версия корзины и идемпотентность в orders; checkout intents отсутствуют. Отсутствующие методы/маршруты: 405/404. Пароли/JWT не попадают в логи и отчёты.
servers:
- url: "/api/v1"
security:
- ShopBearer: []
tags:
- name: Auth
- name: Users
- name: Catalog
- name: Cart
- name: Orders
paths:
  "/auth/register":
    post:
      operationId: registerUser
      tags:
      - Auth
      summary: Зарегистрировать пользователя
      description: |-
        В обоих режимах: нормализация и валидация, PasswordEncoder, атомарные User + пустая Cart(revision=0,coupon=null). Токен выдаётся отдельным login. Ошибка откатывает обе записи. Повтор с тем же login/email — конфликт, не новый пользователь.

        409: LOGIN_TAKEN, EMAIL_TAKEN. При одновременном конфликте приоритет LOGIN_TAKEN.
      responses:
        '201':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                id: 1
                login: alice
                name: Alice
                email: alice@example.test
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
        '415':
          "$ref": "#/components/responses/Error415"
        '409':
          "$ref": "#/components/responses/Error409"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
            example:
              login: alice
              password: synthetic-pass-01
              name: Alice
              email: alice@example.test
      security: []
  "/auth/login":
    post:
      operationId: loginUser
      tags:
      - Auth
      summary: Получить тестовый JWT
      description: Неверная пара — 401 INVALID_CREDENTIALS; существующий и неизвестный
        login не различаются по тексту ответа. Gateway login policy может вернуть
        429. Пароль не логируется.
      responses:
        '200':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResult"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
        '415':
          "$ref": "#/components/responses/Error415"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
            example:
              login: alice
              password: synthetic-pass-01
      security: []
  "/users/{userId}":
    get:
      operationId: getUser
      tags:
      - Users
      summary: Прочитать профиль по ID
      description: 'Protected: только собственный профиль; неизвестный и чужой — одинаковый
        404. Vulnerable намеренно пропускает owner-check (BO-02).'
      responses:
        '200':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          "$ref": "#/components/schemas/Id"
  "/products":
    get:
      operationId: searchProducts
      tags:
      - Catalog
      summary: Поиск опубликованных товаров
      description: 'Буквальное регистронезависимое вхождение q в name/description;
        % и _ не wildcard. Фиксированный ORDER BY id ASC. Protected: параметризованный
        SQL и published=true. Vulnerable: изолированный учебный SQL-case IJ-01; SELECT-only
        datasource products. Параметра sort нет.'
      responses:
        '200':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductPage"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ''
          maxLength: 120
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000
          default: 0
  "/cart":
    get:
      operationId: getCart
      tags:
      - Cart
      summary: Прочитать свою корзину
      description: Корзина определяется JWT subject; owner/userId в запросе не принимаются.
      responses:
        '200':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Cart"
              example:
                id: 1
                userId: 1
                revision: 0
                items: []
                coupon:
                subtotal: 0
                discount: 0
                total: 0
                currency: RUB
                updatedAt: '2026-10-23T12:00:00Z'
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
  "/cart/items/{productId}":
    put:
      operationId: setCartQuantity
      tags:
      - Cart
      summary: Создать позицию или заменить количество
      description: Абсолютное количество, не инкремент. Row lock cart; no-op не повышает
        revision. Quantity=0 — ошибка 400, не удаление. Неизвестный/draft product
        — 404; более 100 позиций — 400 CART_LIMIT_EXCEEDED. Vulnerable допускает учебные
        нарушения quantity при отключённой schema policy.
      responses:
        '200':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Cart"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
        '415':
          "$ref": "#/components/responses/Error415"
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          "$ref": "#/components/schemas/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetQuantityRequest"
            example:
              quantity: 2
  "/cart/coupon":
    put:
      operationId: selectCartCoupon
      tags:
      - Cart
      summary: Выбрать или заменить купон
      description: |-
        Один купон, без расходования used_count. Неизвестный код — 404. Повторный выбор не накапливает скидку и не повышает revision. Срок и остаток проверяются сейчас и повторно в checkout.

        409: COUPON_EXPIRED, COUPON_EXHAUSTED.
      responses:
        '200':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Cart"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
        '415':
          "$ref": "#/components/responses/Error415"
        '409':
          "$ref": "#/components/responses/Error409"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SelectCouponRequest"
            example:
              code: DEMO10
  "/orders":
    post:
      operationId: checkoutOrder
      tags:
      - Orders
      summary: Оформить заказ или вернуть прежний успех
      description: |-
        Protected: key lock → lookup orders → cart lock → coupon. Тот же key/body возвращает сохранённые 201/Order до проверки текущей корзины/купона. Новый key для уже оформленной cartRevision отклоняется до проверки текущей revision. Успех атомарно сохраняет order/items/key/response, расходует купон, очищает корзину/купон и повышает revision. Errors не кешируются. Idempotency-Replayed обязателен. После timeout повторяют тот же key/body. Vulnerable пропускает key lookup/защиту revision и сохраняет корзину после checkout для воспроизводимого replay. JSONL пишется после commit/rollback.

        409: IDEMPOTENCY_CONFLICT (тот же key, другое тело); CART_ALREADY_CHECKED_OUT (новый key, оформленная revision); CART_CHANGED; CART_EMPTY; PRICE_CHANGED; COUPON_EXPIRED; COUPON_EXHAUSTED; OPERATION_IN_PROGRESS (ограниченное ожидание key lock).
      responses:
        '201':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
            Idempotency-Replayed:
              description: 'Обязателен: false при новом эффекте, true при возврате
                сохранённого результата.'
              schema:
                type: boolean
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Order"
              example:
                id: 1
                userId: 1
                cartId: 1
                cartRevision: 7
                status: CREATED
                items:
                - productId: 1
                  name: Тестовый товар
                  quantity: 2
                  unitPrice: 1500
                  lineTotal: 3000
                coupon:
                  code: DEMO10
                  discountPercent: 10
                subtotal: 3000
                discount: 300
                total: 2700
                currency: RUB
                createdAt: '2026-10-23T12:00:00Z'
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
        '415':
          "$ref": "#/components/responses/Error415"
        '409':
          "$ref": "#/components/responses/Error409"
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9._-]+$"
          maxLength: 128
          minLength: 16
        description: 'Scope: authenticated user + POST /orders. Случайный ключ; raw
          key не сохраняется.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CheckoutRequest"
            example:
              cartRevision: 7
              quotedTotal: 2700
  "/orders/{orderId}":
    get:
      operationId: getOrder
      tags:
      - Orders
      summary: Прочитать заказ по ID
      description: 'Protected: owner-check до возврата сохранённого Order. Чужой/неизвестный
        заказ — одинаковый 404. Vulnerable пропускает owner-check (BO-01). Истории
        заказов отдельной операцией нет.'
      responses:
        '200':
          description: Успешный результат
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Обязателен для ответов API.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Order"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '413':
          "$ref": "#/components/responses/Error413"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          "$ref": "#/components/schemas/Id"
components:
  securitySchemes:
    ShopBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256; fixed alg/signature/iss/aud/exp/nbf. sub=userId; TTL 15
        минут, skew 5 секунд. Ключ зависит от target. Действительный JWT многократен.
  headers:
    RequestId:
      description: UUID текущего HTTP-attempt, присутствует во всех ответах.
      schema:
        type: string
        format: uuid
  responses:
    Error400:
      description: 'VALIDATION_FAILED: синтаксис, типы, неизвестные или повторяющиеся
        поля/query, bounds.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: VALIDATION_FAILED
            status: 400
            code: VALIDATION_FAILED
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error401:
      description: 'AUTH_REQUIRED: отсутствующий или недействительный credential.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer challenge; обязателен.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:auth-required
            title: AUTH_REQUIRED
            status: 401
            code: AUTH_REQUIRED
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error403:
      description: 'FORBIDDEN: недостаточные полномочия или недопустимый Origin.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: FORBIDDEN
            status: 403
            code: FORBIDDEN
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error404:
      description: 'NOT_FOUND: объект отсутствует либо недоступен.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: NOT_FOUND
            status: 404
            code: NOT_FOUND
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error405:
      description: 'METHOD_NOT_ALLOWED: метод не поддерживается для существующего
        маршрута.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
        Allow:
          schema:
            type: string
          description: Поддерживаемые методы; обязателен.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: METHOD_NOT_ALLOWED
            status: 405
            code: METHOD_NOT_ALLOWED
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error409:
      description: Конфликт состояния или уникальности; конкретные code перечислены
        у операции.
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: Конфликт состояния или уникальности; конкретные code перечислены
              у операции.
            status: 409
            code: STATE_CONFLICT
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error413:
      description: 'PAYLOAD_TOO_LARGE: превышен настроенный бюджет тела.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: PAYLOAD_TOO_LARGE
            status: 413
            code: PAYLOAD_TOO_LARGE
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error415:
      description: 'UNSUPPORTED_MEDIA_TYPE: требуется application/json.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: UNSUPPORTED_MEDIA_TYPE
            status: 415
            code: UNSUPPORTED_MEDIA_TYPE
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error429:
      description: 'RATE_LIMITED: превышен лимит; Retry-After в секундах.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
        Retry-After:
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: Количество секунд; обязателен.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: RATE_LIMITED
            status: 429
            code: RATE_LIMITED
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error500:
      description: 'INTERNAL_ERROR: без SQL, stack trace или секретов.'
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: INTERNAL_ERROR
            status: 500
            code: INTERNAL_ERROR
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
    Error503:
      description: DEPENDENCY_UNAVAILABLE либо RUN_CLOSED; инфраструктурный отказ
        не считается предотвращённой атакой.
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: urn:lab:problem:error
            title: DEPENDENCY_UNAVAILABLE либо RUN_CLOSED; инфраструктурный отказ
              не считается предотвращённой атакой.
            status: 503
            code: DEPENDENCY_UNAVAILABLE
            requestId: e42fb0db-45dc-4b1a-8157-66c3a815e450
  schemas:
    Uuid:
      type: string
      format: uuid
    Time:
      type: string
      format: date-time
      pattern: Z$
      description: UTC RFC 3339, окончание Z.
    Revision:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    Hash:
      type: string
      pattern: "^[a-f0-9]{64}$"
      maxLength: 64
      minLength: 64
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - requestId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 240
          minLength: 1
        status:
          type: integer
          format: int64
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          maxLength: 80
          minLength: 1
        requestId:
          "$ref": "#/components/schemas/Uuid"
    Id:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    Money:
      type: integer
      format: int64
      minimum: 0
      maximum: 9900000000000
    Price:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
    Quantity:
      type: integer
      format: int64
      minimum: 1
      maximum: 99
    LoginInput:
      type: string
      description: 'После trim/lowercase: 3…32 ASCII [a-z0-9_]. Проверка нормализованного
        значения приложением; исходный ввод может иметь пробелы/верхний регистр.'
      x-normalization: trim + lowercase
      x-normalized-pattern: "^[a-z0-9_]{3,32}$"
      minLength: 1
    Password:
      type: string
      writeOnly: true
      description: 8…72 UTF-8 bytes; не нормализовать. minLength не выражает минимум
        байтов для Unicode; обязательна отдельная проверка.
      x-utf8-minBytes: 8
      x-utf8-maxBytes: 72
      maxLength: 72
      minLength: 1
    CouponCodeInput:
      type: string
      description: 'После trim/uppercase: 1…32 символа [A-Z0-9_-]. Проверка после
        нормализации.'
      x-normalized-pattern: "^[A-Z0-9_-]{1,32}$"
      minLength: 1
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - login
      - password
      - name
      - email
      properties:
        login:
          "$ref": "#/components/schemas/LoginInput"
        password:
          "$ref": "#/components/schemas/Password"
        name:
          type: string
          description: 'После trim: 1…100 символов.'
          minLength: 1
        email:
          type: string
          description: 'После trim/lowercase: корректный email до 254 символов. Только
            синтетические адреса.'
          minLength: 1
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - login
      - password
      properties:
        login:
          "$ref": "#/components/schemas/LoginInput"
        password:
          "$ref": "#/components/schemas/Password"
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - login
      - name
      - email
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        login:
          type: string
          pattern: "^[a-z0-9_]+$"
          maxLength: 32
          minLength: 3
        name:
          type: string
          maxLength: 100
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 3
    LoginResult:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - expiresIn
      properties:
        accessToken:
          type: string
          description: Синтетический JWT; не сохранять в логах.
          minLength: 1
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          maximum: 900
    Product:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - price
      - currency
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        name:
          type: string
          maxLength: 120
          minLength: 1
        description:
          type: string
          maxLength: 4000
        price:
          "$ref": "#/components/schemas/Price"
        currency:
          type: string
          const: RUB
    ProductPage:
      type: object
      additionalProperties: false
      required:
      - items
      - limit
      - offset
      - total
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Product"
          minItems: 0
          maxItems: 100
        limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        offset:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000
        total:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    LineItem:
      type: object
      additionalProperties: false
      required:
      - productId
      - name
      - quantity
      - unitPrice
      - lineTotal
      properties:
        productId:
          "$ref": "#/components/schemas/Id"
        name:
          type: string
          maxLength: 120
          minLength: 1
        quantity:
          "$ref": "#/components/schemas/Quantity"
        unitPrice:
          "$ref": "#/components/schemas/Price"
        lineTotal:
          "$ref": "#/components/schemas/Money"
      description: lineTotal=quantity*unitPrice; цена заказа сохранена в order_items.unit_price.
    CartCoupon:
      type: object
      additionalProperties: false
      required:
      - code
      - discountPercent
      - eligibility
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_-]+$"
          maxLength: 32
          minLength: 1
        discountPercent:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        eligibility:
          type: string
          enum:
          - VALID
          - EXPIRED
          - EXHAUSTED
    OrderCoupon:
      type: object
      additionalProperties: false
      required:
      - code
      - discountPercent
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_-]+$"
          maxLength: 32
          minLength: 1
        discountPercent:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
    Cart:
      type: object
      additionalProperties: false
      required:
      - id
      - userId
      - revision
      - items
      - coupon
      - subtotal
      - discount
      - total
      - currency
      - updatedAt
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        userId:
          "$ref": "#/components/schemas/Id"
        revision:
          "$ref": "#/components/schemas/Revision"
        items:
          type: array
          items:
            "$ref": "#/components/schemas/LineItem"
          minItems: 0
          maxItems: 100
        coupon:
          anyOf:
          - "$ref": "#/components/schemas/CartCoupon"
          - type: 'null'
        subtotal:
          "$ref": "#/components/schemas/Money"
        discount:
          "$ref": "#/components/schemas/Money"
        total:
          "$ref": "#/components/schemas/Money"
        currency:
          type: string
          const: RUB
        updatedAt:
          "$ref": "#/components/schemas/Time"
      description: 'subtotal=sum(lineTotal), discount=floor(subtotal*percent/100),
        total=subtotal-discount. Пустая корзина: суммы 0. Недоступный выбранный купон
        остаётся видимым, discount=0. revision растёт только при фактическом изменении;
        не более 100 разных productId.'
    SetQuantityRequest:
      type: object
      additionalProperties: false
      required:
      - quantity
      properties:
        quantity:
          "$ref": "#/components/schemas/Quantity"
    SelectCouponRequest:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          "$ref": "#/components/schemas/CouponCodeInput"
    CheckoutRequest:
      type: object
      additionalProperties: false
      required:
      - cartRevision
      - quotedTotal
      properties:
        cartRevision:
          "$ref": "#/components/schemas/Revision"
        quotedTotal:
          "$ref": "#/components/schemas/Money"
    Order:
      type: object
      additionalProperties: false
      required:
      - id
      - userId
      - cartId
      - cartRevision
      - status
      - items
      - coupon
      - subtotal
      - discount
      - total
      - currency
      - createdAt
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        userId:
          "$ref": "#/components/schemas/Id"
        cartId:
          "$ref": "#/components/schemas/Id"
        cartRevision:
          "$ref": "#/components/schemas/Revision"
        status:
          type: string
          const: CREATED
        items:
          type: array
          items:
            "$ref": "#/components/schemas/LineItem"
          minItems: 1
          maxItems: 100
        coupon:
          anyOf:
          - "$ref": "#/components/schemas/OrderCoupon"
          - type: 'null'
        subtotal:
          "$ref": "#/components/schemas/Money"
        discount:
          "$ref": "#/components/schemas/Money"
        total:
          "$ref": "#/components/schemas/Money"
        currency:
          type: string
          const: RUB
        createdAt:
          "$ref": "#/components/schemas/Time"
      description: Неизменяемый сохранённый ответ. Без купона discount=0. Суммы вычисляет
        сервер; данные ответа и order/items фиксируются одной транзакцией.
