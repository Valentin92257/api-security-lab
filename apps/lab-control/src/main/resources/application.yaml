spring:
  application:
    name: lab-control
  datasource:
    url: jdbc:postgresql://db:5432/lab_control
    username: control_app
    password: ${LAB_CONTROL_DB_PASSWORD}
  flyway:
    default-schema: control
    locations: classpath:db/control/migrations
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
lab:
  control:
    operator-token: ${LAB_OPERATOR_TOKEN:}
  fixture:
    username: ${LAB_FIXTURE_DB_USER:fixture_admin}
    password: ${LAB_FIXTURE_DB_PASSWORD:}
    vulnerable-url: ${LAB_FIXTURE_VULNERABLE_DB_URL:jdbc:postgresql://db:5432/vulnerable}
    protected-url: ${LAB_FIXTURE_PROTECTED_DB_URL:jdbc:postgresql://db:5432/protected}
    user-count: ${LAB_FIXTURE_USER_COUNT:24}
    cs-attempts: ${LAB_FIXTURE_CS_ATTEMPTS:200}
    cs-valid-accounts: ${LAB_FIXTURE_CS_VALID_ACCOUNTS:3}
