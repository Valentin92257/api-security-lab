spring:
  application:
    name: lab-control
  datasource:
    url: jdbc:postgresql://db:5432/lab_control
    username: control_app
    password: ${LAB_CONTROL_DB_PASSWORD}
  flyway:
    default-schema: control
    locations: classpath:db/control/migrations
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
lab:
  control:
    operator-token: ${LAB_OPERATOR_TOKEN:}
