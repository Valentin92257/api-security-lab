spring:
  application:
    name: lab-control
  datasource:
    url: ${LAB_CONTROL_DB_URL:jdbc:postgresql://postgres:5432/lab_control}
    username: control_app
    password: ${LAB_CONTROL_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
lab:
  control:
    operator-token: ${LAB_OPERATOR_TOKEN:}
